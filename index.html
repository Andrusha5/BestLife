<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BestLife - 2D Life Simulator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- 1. НИТРО / ИНТРО ЭКРАН -->
    <div id="intro-screen">
        <div class="intro-content">
            <h1 class="intro-title">BestLife</h1>
            <p class="intro-subtitle">by Best</p>
        </div>
    </div>

    <!-- 2. ГЛАВНОЕ МЕНЮ -->
    <div id="main-menu" class="hidden">
        <div class="menu-card">
            <h1 class="game-logo">BestLife</h1>
            <p class="game-sublogo">Симулятор жизни</p>

            <div class="menu-buttons">
                <button id="btn-play" class="btn btn-primary">
                    <span class="btn-icon">▶</span> Играть
                </button>
                <button id="btn-settings" class="btn btn-secondary">
                    <span class="btn-icon">⚙</span> Настройки
                </button>
            </div>
        </div>
    </div>

    <!-- ОКНО НАСТРОЕК -->
    <div id="settings-modal" class="modal hidden">
        <div class="modal-card">
            <h2>⚙ Настройки</h2>
            <p class="settings-placeholder">Раздел настроек находится в разработке. Скоро здесь появится управление звуком, графикой и управлением!</p>
            <button id="btn-close-settings" class="btn btn-secondary">Закрыть</button>
        </div>
    </div>

    <!-- 3. ИГРОВОЙ ЭКРАН С КАРТОЙ -->
    <div id="game-screen" class="hidden">
        <!-- Холст игры -->
        <canvas id="gameCanvas"></canvas>

        <!-- Игровой интерфейс (HUD) -->
        <div id="hud">
            <div class="hud-stat">💰 Деньги: <span id="val-money">1 000</span> $</div>
            <div class="hud-stat">⚡ Энергия: <span id="val-energy">100</span>%</div>
            <div class="hud-stat">🍕 Сытость: <span id="val-food">80</span>%</div>
            
            <div class="hud-controls">
                <button id="btn-rotate" class="btn-hud" title="Повернуть карту на 90°">🔄 Повернуть</button>
                <button id="btn-reset-cam" class="btn-hud" title="Сбросить камеру">🎯 По центру</button>
            </div>
        </div>

        <!-- Окно взаимодействия со зданием -->
        <div id="building-modal" class="modal hidden">
            <div class="modal-card">
                <h3 id="b-title">Название здания</h3>
                <p id="b-desc">Описание</p>
                <div id="b-actions" class="action-buttons">
                    <!-- Кнопки действий генерируются через JS -->
                </div>
                <button id="btn-close-building" class="btn btn-secondary" style="margin-top:15px;">Закрыть</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
  </html>
