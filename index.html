<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BestLife - 2D Life Simulator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- 1. НИТРО / ИНТРО ЭКРАН -->
    <div id="intro-screen">
        <div class="intro-center">
            <h1 class="intro-title">BestLife</h1>
        </div>
        <div class="intro-footer">
            <p class="intro-subtitle">by Best</p>
        </div>
    </div>

    <!-- 2. ГЛАВНОЕ МЕНЮ -->
    <div id="main-menu" class="hidden">
        <div class="menu-card">
            <h1 class="game-logo">BestLife</h1>
            <p class="game-sublogo">Симулятор жизни</p>

            <div class="menu-buttons">
                <button id="btn-play" class="btn btn-primary">
                    <span class="btn-icon">▶</span> Играть
                </button>
                <button id="btn-settings" class="btn btn-secondary">
                    <span class="btn-icon">⚙</span> Настройки
                </button>
            </div>
        </div>
    </div>

    <!-- ОКНО НАСТРОЕК -->
    <div id="settings-modal" class="modal hidden">
        <div class="modal-card">
            <h2>⚙ Настройки</h2>
            <p class="settings-placeholder">Раздел настроек находится в разработке.</p>
            <button id="btn-close-settings" class="btn btn-secondary">Закрыть</button>
        </div>
    </div>

    <!-- 3. ИГРОВОЙ ЭКРАН С КАРТОЙ -->
    <div id="game-screen" class="hidden">
        <canvas id="gameCanvas"></canvas>
        
        <!-- Верхняя кнопка выхода в меню -->
        <div id="game-ui">
            <button id="btn-menu-back" class="hud-btn">🚪 В меню</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
